# Public GerClaw entry: authentication and per-account child DSH Host gateway.
- id: webserver
  name: "@deepseek-ai/dsh-host-webserver"
  config:
    host: !!js process.env.GERCLAW_BIND_HOST || '127.0.0.1'
    port: !!js Number(process.env.GERCLAW_PORT || 3000)

- insert:
    - id: gerclaw-tenant-gateway
      name: "@gerclaw/tenant-gateway"
      config:
        rootDir: !!js process.cwd()
        dataDir: !!js process.env.GERCLAW_DATA_DIR || dshHomePath('gerclaw-tenants')
        childPatch: !!js "process.getBuiltinModule('node:path').join(process.cwd(), 'packages/gerclaw/profile-bundle/cordis.patch.yml')"
        idleMs: 1800000

- id: web-runtime
  disabled: true

# GerClaw patient/clinician product profile. This layer intentionally replaces
# the deployment system prompt while retaining DSH's native plan, goal, skill,
# session, file, workspace, storage and tool services.

- id: system-prompt
  disabled: true

# The voice service is mounted through the GerClaw bundle layer. Declare its
# package-owned Typert face explicitly so all Remote routes (notably
# talk/interrupt) are registered before the browser contribution starts.
- id: typert-loader
  config:
    packages:
      - "@gerclaw/voice"
      - "@gerclaw/app"

- insert:
    - id: gerclaw-system-prompt
      name: "@gerclaw/system-prompt"

# The Web bundle ships JSON storage. GerClaw account Hosts use the native
# SQLite backend so session projections, workspaces, private Library data and
# medical records survive Host restarts inside the account-owned directory.
- insert:
    - id: storage-sqlite
      name: "@deepseek-ai/dsh-storage-sqlite"
      config:
        path: !!js "process.getBuiltinModule('node:path').join(process.env.GERCLAW_ACCOUNT_DATA_DIR || dshHomePath('gerclaw-data'), 'storage.sqlite')"

- id: skill-filesystem
  name: "@deepseek-ai/dsh-skill-filesystem"
  # The web profile deliberately leaves this host-level provider disabled.
  # GerClaw's preset mounts the provider inside the agent scope below, which
  # makes the same catalog visible to the native skill tool and the model.
  disabled: true

- id: tool-skill
  disabled: false

- id: command-feedback
  disabled: true

- id: command-compact
  disabled: true

- id: session-log-download
  disabled: true

- id: permission
  disabled: true

# Keep the native, account-scoped user tools required by health conversations.
# Developer shell and Cordis management tools remain outside the product profile.
- id: tool-fs
  disabled: false

- id: tool-fs-search
  disabled: false

- id: tool-web
  disabled: false
  config:
    fetch: false
    searchTimeoutMs: 60000

- id: web
  config:
    searchProvider: anysearch
    fetchProvider: anysearch

- id: web-search-anysearch
  config:
    apiKeyEnv: ANYSEARCH_API_KEY
    baseURL: !!js process.env.ANYSEARCH_URL || 'https://api.anysearch.com'

- id: web-search-deepseek
  disabled: true

- id: tool-goal
  disabled: false

- id: compaction-basic
  disabled: false

- id: agent-presets
  name: "@deepseek-ai/dsh-agent-presets"
  config:
    default: gerclaw
    roots:
      - path: !!js "process.getBuiltinModule('node:path').join(process.env.GERCLAW_ROOT_DIR, 'packages/gerclaw/profile-bundle/presets')"
        trust: system
    includeUserRoot: false

# Goal is Host-scoped. Plan stays exclusively inside the GerClaw agent preset,
# matching DSH's native isolated plan composition.
- id: goal
  name: "@deepseek-ai/dsh-goal"

- id: goal-round-driver
  name: "@deepseek-ai/dsh-goal-round-driver"

- id: command-goal
  name: "@deepseek-ai/dsh-command-goal"

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: gerclaw-primary
    model: !!js process.env.AGENT_PRIMARY_MODEL || 'deepseek-chat'

- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek"
  disabled: true
  config:
    apiKeyEnv: AGENT_PRIMARY_API_KEY
    baseURL: !!js process.env.AGENT_PRIMARY_URL
    thinking: disabled
    reasoningEffort: off
    maxTokens: 4096
    streamIdleTimeoutMs: 30000
    models:
      - id: !!js process.env.AGENT_PRIMARY_MODEL || 'deepseek-chat'
        name: GerClaw 主模型

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      gerclaw-primary:
        displayName: GerClaw 主模型
        apiKeyEnv: AGENT_PRIMARY_API_KEY
        api: openai-completions
        baseURL: !!js process.env.AGENT_PRIMARY_URL
        compat: { thinkingFormat: deepseek }
        models: !!js "[{ id: process.env.AGENT_PRIMARY_MODEL || 'deepseek-chat', name: 'GerClaw 主模型' }]"

- id: webserver
  name: "@deepseek-ai/dsh-host-webserver"
  config:
    host: 127.0.0.1
    port: !!js Number(process.env.GERCLAW_HOST_PORT || 3080)

- insert:
    - id: gerclaw-library-dsh
      name: "@gerclaw/library-dsh"
      config:
        library: gerclaw-user
        chunkSize: 900
        chunkOverlap: 120
        embeddingCommand: !!js "process.execPath + ' --env-file=' + process.getBuiltinModule('node:path').join(process.env.GERCLAW_ROOT_DIR, '.env') + ' ' + process.getBuiltinModule('node:path').join(process.env.GERCLAW_ROOT_DIR, 'packages/gerclaw/local-rag/scripts/siliconflow-embedder.mjs')"
        embeddingDimensions: !!js Number(process.env.GERCLAW_RAG_EMBEDDING_DIMENSIONS || 1024)

    - id: gerclaw-shared-rag-storage
      name: cordis:group
      group: true
      isolate:
        storage: gerclaw-shared-rag
        storage.backend.sqlite: gerclaw-shared-rag
        storageDomain: gerclaw-shared-rag
      config:
        - id: shared-storage
          name: "@deepseek-ai/dsh-storage"
        - id: shared-storage-sqlite
          name: "@deepseek-ai/dsh-storage-sqlite"
          config:
            path: !!js "process.getBuiltinModule('node:path').join(process.env.GERCLAW_ROOT_DIR, '.gerclaw', 'shared-rag', 'index.sqlite')"
        - id: shared-storage-domain
          name: "@gerclaw/storage-domain-isolated"
          config: { backend: sqlite }
        - id: gerclaw-shared-knowledge
          name: "@gerclaw/shared-knowledge"
          config:
            knowledgeBasePath: !!js "process.getBuiltinModule('node:path').join(process.env.GERCLAW_ROOT_DIR, 'knowledge-base')"
            sharedIndexRoot: !!js "process.getBuiltinModule('node:path').join(process.env.GERCLAW_ROOT_DIR, '.gerclaw', 'shared-rag')"
            library: gerclaw-medical-sf-v3
            embeddingCommand: !!js "process.execPath + ' --env-file=' + process.getBuiltinModule('node:path').join(process.env.GERCLAW_ROOT_DIR, '.env') + ' ' + process.getBuiltinModule('node:path').join(process.env.GERCLAW_ROOT_DIR, 'packages/gerclaw/local-rag/scripts/siliconflow-embedder.mjs')"
            embeddingDimensions: !!js Number(process.env.GERCLAW_RAG_EMBEDDING_DIMENSIONS || 1024)
            embeddingModel: !!js "process.env.EMBEDDING_MODEL || 'BAAI/bge-m3'"
            rerankApiKey: !!js process.env.SILICONFLOW_API_KEY
            rerankUrl: !!js process.env.SILICONFLOW_URL
            rerankModel: !!js process.env.RERANK_MODEL

    - id: gerclaw-rag
      name: "@gerclaw/rag"
      config:
        rerankApiKey: !!js process.env.SILICONFLOW_API_KEY
        rerankUrl: !!js process.env.SILICONFLOW_URL
        rerankModel: !!js process.env.RERANK_MODEL

    - id: memorix
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        transport: stdio
        serverName: memorix
        command: !!js process.execPath
        args:
          - !!js "process.getBuiltinModule('node:path').join(process.env.GERCLAW_ROOT_DIR, 'packages/gerclaw/profile-bundle/node_modules/memorix/dist/cli/index.js')"
          - serve
        env:
          MEMORIX_DATA_DIR: !!js process.env.MEMORIX_DATA_DIR || dshHomePath('memorix')
        cwd: !!js process.env.GERCLAW_ACCOUNT_DATA_DIR || process.cwd()
        toolCallTimeoutMs: 60000
        failOnStartupError: true

    - { id: gerclaw-cga, name: "@gerclaw/cga" }
    - { id: gerclaw-medication-review, name: "@gerclaw/medication-review" }
    - { id: gerclaw-health-profile, name: "@gerclaw/health-profile" }
    - { id: gerclaw-chronic-care, name: "@gerclaw/chronic-care" }
    - { id: gerclaw-companion, name: "@gerclaw/companion" }
    - { id: gerclaw-risk-alert, name: "@gerclaw/risk-alert" }
    - { id: gerclaw-medical-evidence, name: "@gerclaw/medical-evidence-public" }
    - { id: gerclaw-skills, name: "@gerclaw/skills" }

    - id: gerclaw-health-repository
      name: "@gerclaw/health-repository-storage"

    - id: gerclaw-artifacts
      name: "@gerclaw/artifact-local"
      config:
        dataDir: !!js process.env.GERCLAW_ACCOUNT_DATA_DIR || dshHomePath('gerclaw-data')

    - id: gerclaw-task-runtime
      name: "@gerclaw/task-runtime-local"

    - id: gerclaw-document-parser
      name: "@gerclaw/document-parser-mineru"
      config:
        apiBaseUrl: !!js "process.env.MINERU_URL ? new URL(process.env.MINERU_URL).origin : 'https://mineru.net'"
        tokenCredential: MINERU_API_KEY
        modelVersion: vlm
        language: ch
        timeoutMs: 600000

    - id: gerclaw-speech-qianwen
      name: "@gerclaw/speech-qianwen"
      config:
        asrApiKey: !!js process.env.MODEL_ASR_KEY
        asrUrl: !!js process.env.MODEL_ASR_URL
        ttsApiKey: !!js process.env.MODEL_TTS_KEY
        ttsUrl: !!js process.env.MODEL_TTS_URL
        asrModel: !!js process.env.ASR_MODEL
        ttsModel: !!js process.env.TTS_MODEL
        ttsVoice: Cherry

    - id: gerclaw-voice
      name: "@gerclaw/voice"
      config:
        record:
          enabled: true
          maxSeconds: 60
          autoSubmit: true
        stt:
          language: zh-CN
          interim: true
        tts: { voice: Cherry }
        interrupt: true

    - id: gerclaw-prescription
      name: "@gerclaw/prescription"
      config:
        subagentProvider: spawn

    - id: gerclaw-app
      name: "@gerclaw/app"
      config:
        rootDir: !!js process.env.GERCLAW_ROOT_DIR
        dataDir: !!js process.env.GERCLAW_ACCOUNT_DATA_DIR || dshHomePath('gerclaw-data')
        accountId: !!js process.env.GERCLAW_ACCOUNT_ID || 'local'
        audience: !!js process.env.GERCLAW_AUDIENCE || 'patient'

    - id: gerclaw-client-ui
      name: "@gerclaw/client-ui"

- id: storage-domain
  config:
    backend: sqlite

# GerClaw uses the native DSH Web Client and adds product UI through client
# slots. Only generic developer and official-brand occupants stay disabled.
- id: ui-settings
  disabled: false
- id: ui-settings-general
  disabled: true
- id: ui-settings-models
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-brand-official
  disabled: true
- id: ui-cordis
  disabled: true
- id: ui-workflow-run
  disabled: true
- id: ui-subagent
  disabled: true
- id: ui-jobs
  disabled: true
- id: ui-permission
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-trajectory
  disabled: true

# GerClaw agent-plane composition. The deployment-level GerClaw system prompt
# remains authoritative; this preset deliberately contributes no coding persona,
# shell, terminal, plugin-management or developer skill roots.

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:path').join(process.env.GERCLAW_ROOT_DIR, 'packages/gerclaw/skills/skills')"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |-
          你正在使用 GerClaw 计划模式。先读取当前账号可用的健康资料和用户目标，把任务拆成用户能理解的步骤；只做读取、检索和分析，不执行会改变数据的动作。计划最多 5 步、每步一句，正文不超过 800 个中文字符；只保留必要输入、风险信号、预期结果与验证方式，不重复背景知识。本轮禁止把计划作为普通最终回复输出；完成计划后必须立即调用 exit_plan_mode，把完整 Markdown 计划作为该工具参数提交审核。只有工具返回用户明确批准后才能执行。

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
